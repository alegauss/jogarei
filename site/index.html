<!doctype html>
<html lang="en" data-tone="cool">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/jogarei/logo.svg" />

    <!--
      The theme follows the OS, and a stored choice wins over it. The design system's
      pre-paint script replaces the anchor below, inlined by vite.config.ts: the tokens the
      body background reads are keyed off data-theme alone, so it states the OS preference
      too, before first paint. scripts/prerender.mjs patches the rest of this head per route.
    -->
    <!--theme-script-->

    <!-- Google Analytics is not in this head: it loads only after the visitor allows it, from
         the banner in components/Consent.tsx. -->

    <title>Jogarei: console remote play, rebuilt for Windows</title>
    <meta
      name="description"
      content="A free remote play client for Windows that works with PS4 and PS5 consoles, built on .NET 10 and WPF. Ten-bit video through DirectComposition, hardware decode on whatever card you own, your consoles and pairings carried over, and no bundled browser."
    />

    <!--
      scripts/prerender.mjs patches the title, description, canonical and og:url per route by
      replace-or-throw, and inlines the rendered body into the root element. Note: no closing
      head or script token may appear in a comment here, or the Vite asset injection and the
      prerender both anchor to it instead of the real one.
    -->

    <!-- Reveal-on-scroll starts at opacity 0 and is lifted by the client observer. With no JS
         the prerendered text is still in the DOM; this makes it visible too. -->
    <noscript>
      <style>
        .reveal {
          opacity: 1 !important;
          transform: none !important;
        }
      </style>
    </noscript>
  </head>
  <body class="vg-site">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
